services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: casework
      POSTGRES_DB: casework
    ports:
      # Mapped off the default 5432 so this never silently loses a port
      # fight with a system-level Postgres a dev machine happens to have
      # running (verified this was a real, not theoretical, problem: a
      # native Homebrew postgresql@18 service was winning that port,
      # so every host-side script/tool connecting to "localhost:5432"
      # was silently talking to the wrong database).
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: casework
      POSTGRES_DB: casework_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL/TEST_DATABASE_URL: inside the
      # compose network the db/db_test services are reachable at those
      # hostnames, not "localhost" (which only reaches the other services
      # from the host, via the ports: mappings below and on db_test).
      DATABASE_URL: postgresql://casework:casework@db:5432/casework
      TEST_DATABASE_URL: postgresql://casework:casework@db_test:5432/casework_test
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Anonymous volume: keeps the container's own Linux .venv (built by
      # the Dockerfile's `uv sync`) from being shadowed by the host bind
      # mount above -- without this, the container tries to run the host's
      # macOS-compiled .venv (if one exists from local `uv run` use) and
      # fails immediately on the binary mismatch.
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      # Same reasoning as backend's /app/.venv -- keeps the container's own
      # node_modules (npm install runs at container startup, below) from
      # being shadowed by the host's, which may hold macOS-only native
      # binaries (e.g. Rollup's platform-specific optional dependencies).
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
