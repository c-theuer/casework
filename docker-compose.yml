services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: casework
      POSTGRES_DB: casework
    ports:
      # Mapped off the default 5432 so this never silently loses a port
      # fight with a system-level Postgres a dev machine happens to have
      # running (verified this was a real, not theoretical, problem: a
      # native Homebrew postgresql@18 service was winning that port,
      # so every host-side script/tool connecting to "localhost:5432"
      # was silently talking to the wrong database).
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: casework
      POSTGRES_PASSWORD: casework
      POSTGRES_DB: casework_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casework"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL: inside the compose network the
      # db service is reachable at hostname "db", not "localhost".
      DATABASE_URL: postgresql://casework:casework@db:5432/casework
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  db_data:
