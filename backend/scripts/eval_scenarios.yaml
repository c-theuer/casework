# Hand-labeled eval scenarios for scripts/run_eval.py, per casework-spec.md
# §10: 20 scenarios (card_testing 5, account_takeover 4, merchant_fraud 3,
# mule_activity 3, friendly_fraud 3, benign 2), scored against ground truth.
#
# Timestamps: `occurred_minutes_ago` (main signal) and `prior_signals[].
# minutes_ago` are both resolved by the harness against one `run_now`
# captured fresh at startup -- never hardcode an absolute occurred_at here,
# it would silently fall out of the 10-minute velocity window once real
# time moves past it.
#
# `prior_signals` (pre-seeds signals_log directly, bypassing handle_signal,
# to give CoordinatorService._velocity_context's real count_recent() query
# something to find) is only a meaningful mechanism for card_testing (stack
# several within the 10-minute window on the same account/device) and
# loosely mule_activity. It's deliberately omitted for account_takeover
# (the pattern's essence is a genuinely *new* device -- recent_device_
# count_10min should read 0) and isn't used at all for merchant_fraud/
# friendly_fraud/benign, which have no velocity signature -- those rely on
# descriptive payload/flag_reason text instead.
#
# Account IDs: acct_thinhistory_1 (1 seeded prior merchant_fraud case) and
# acct_thinhistory_2 (2 seeded prior account_takeover cases) are reused by
# exactly one scenario each below, specifically so the real Research Agent's
# Postgres query finds real similar_cases instead of an empty brief (spec
# §8). Every other scenario gets its own dedicated synthetic account_id --
# sharing an account_id across scenarios would let one scenario's Research
# Brief pick up another scenario's freshly-committed eval case from earlier
# in the same run, since both write to and read from the same live database.
#
# expected_route is ground-truthed against Route (critical/elevated/low),
# not the LLM's own raw tier self-label -- see decide_route() in
# coordinator_service.py. Structural note: decide_route only ever returns
# CRITICAL for pattern in {card_testing, account_takeover}, so every
# merchant_fraud/mule_activity/friendly_fraud scenario below is
# ground-truthed elevated (never critical -- that route is structurally
# unreachable for those patterns regardless of confidence).

scenarios:
  # --- card_testing (5): rapid small-value auth attempts across a card range ---
  - id: card_testing_01
    ground_truth: {pattern: card_testing, expected_route: critical}
    signal:
      signal_id: eval_card_testing_01
      signal_type: transaction
      account_id: acct_eval_card_testing_01
      occurred_minutes_ago: 0
      upstream_score: 0.93
      flag_reason: "ml_score_0.93_high_velocity_small_amount"
      payload:
        amount: 1.00
        merchant_id: merch_eval_electronics_1
        device_context: known_device
        geo_context: usual_location
        session_flags: {recent_password_reset: false, mfa_completed: true, failed_logins_this_session: 0}
    prior_signals:
      - {minutes_ago: 8}
      - {minutes_ago: 6}
      - {minutes_ago: 4}
