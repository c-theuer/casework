[project]
name = "casework-backend"
version = "0.1.0"
description = "Casework fraud-signal triage backend"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "stripe>=11.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# C408: dict(...) as a keyword-heavy test-fixture builder reads fine; not
# worth rewriting every factory helper to a literal.
# B008: FastAPI's Depends(...)-in-default-argument is the framework's
# documented, required pattern, not the antipattern this rule targets.
ignore = ["C408", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
